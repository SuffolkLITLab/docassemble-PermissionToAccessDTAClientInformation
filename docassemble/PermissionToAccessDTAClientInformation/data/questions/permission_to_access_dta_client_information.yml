code: |
  al_form_type = "other"
  AL_DEFAULT_COUNTRY = "US"
  AL_DEFAULT_STATE = "MA"
  github_repo_name = "docassemble-PermissionToAccessDTAClientInformation"
---
template: interview_short_title
content: |
  Give someone permission to talk with DTA
---
features:
  navigation: true
  cache documents: false
  tagged pdf: true
---
sections:
  - dta_review: Review your answers
---
initial: true
code: |
  # Regenerate the attachment after a client edits any answer.
  undefine("dta_consent")
---
mandatory: true
code: |
  al_intro_screen
  dta_intro
  if permission_purpose != "information":
    dta_other_help
  client_name
  client_birthdate
  dta_identifier_kind
  if dta_identifier_kind == "ssn":
    ssn_last_four
  else:
    dta_agency_id
  recipient_name
  recipient_address
  recipient_phone
  dta_preview
  dta_download
---
id: dta introduction
question: |
  Let someone talk with DTA about your benefits
subquestion: |
  DTA is the Massachusetts Department of Transitional Assistance. It runs
  SNAP (food stamps), TAFDC, and EAEDC cash benefits.

  Name **one person or group** you trust. A group could be a food pantry or legal aid office.
  This form lets DTA share private facts about your benefit cases with them.
  It also lets DTA get facts from them. The DTA client is the person whose case it is.
  The client must sign the form.

  This permission lasts for **one year**. You can cancel it sooner.
  Call DTA at 1-877-382-2363 or write to DTA to ask to cancel it.

  It does not let someone sign forms or use your benefits.
  You need a different form for that.
continue button field: dta_intro
---
id: dta permission purpose
question: |
  What do you want this person or group to do?
fields:
  - no label: permission_purpose
    input type: radio
    choices:
      - Talk with DTA and share information about my benefit cases: information
      - Sign forms for me or use my benefits: representative
      - I am not sure: unsure
---
id: dta other help
event: dta_other_help
question: |
  Choose the right kind of help
subquestion: |
  This form only lets someone talk with DTA and share facts about your case.

  Do you want someone to sign SNAP forms or use your benefits?
  This includes SNAP, TAFDC, or EAEDC. Use this tool:
  [Choose someone to help with your benefits](https://apps.suffolklitlab.org/interview?i=docassemble.AuthorizeFoodBenefitsRepresentative%3Adata%2Fquestions%2Fauthorize_food_benefits_representative.yml).

  If you are not sure which form you need, call DTA at **1-877-382-2363**.

  ${ action_button_html(url_action('permission_purpose'), label='Change my answer', color='primary') }
buttons:
  - Exit: exit
    url: https://www.mass.gov/lists/voluntary-consent-to-release-information
---
id: dta client
question: |
  Who is the DTA client?
subquestion: |
  Enter the name of the person whose case DTA will talk about.
  Use the name on their DTA case. If you are helping someone, enter their name.
fields:
  - Full name: client_name
  - Date of birth: client_birthdate
    datatype: date
    max: ${ today() }
---
id: dta identifier
question: |
  Which case number will you use?
subquestion: |
  The Agency ID is on DTA letters. Use that number if you have it.
  Or use the last four numbers of the client’s Social Security number.
  Do not enter the full Social Security number.
fields:
  - Number to use: dta_identifier_kind
    input type: radio
    choices:
      - DTA Agency ID: agency
      - Last four numbers of Social Security number: ssn
  - DTA Agency ID: dta_agency_id
    datatype: text
    show if:
      variable: dta_identifier_kind
      is: agency
  - Last four numbers: ssn_last_four
    datatype: text
    minlength: 4
    maxlength: 4
    show if:
      variable: dta_identifier_kind
      is: ssn
validation code: |
  if dta_identifier_kind == "ssn" and (len(ssn_last_four) != 4 or any(c not in "0123456789" for c in ssn_last_four)):
    validation_error("Enter four numbers, like 0123.", field="ssn_last_four")
  if dta_identifier_kind == "agency" and not dta_agency_id.strip():
    validation_error("Enter the Agency ID from a DTA notice.", field="dta_agency_id")
---
id: dta recipient
question: |
  Who may get the DTA case information?
subquestion: |
  Name **one** person or group you trust. This is who DTA may talk with
  about your cases. For a group, use its full name and mailing address.
fields:
  - Person or group name: recipient_name
  - Mailing address: recipient_address
    input type: area
    rows: 3
    help: |
      Include the street and unit, city or town, state, and ZIP code.
  - Phone number, if known: recipient_phone
    datatype: text
    required: false
---
id: dta preview
question: |
  Check the form before you print it
subquestion: |
  Check the client's name and case number. Make sure this is the person or
  group the client wants DTA to share information with.

  ${ dta_consent }

  ${ action_button_html(url_action('dta_review'), label='Edit answers', color='primary') }

  The form uses these words:

  * **Consent** means permission.
  * **Relevant confidential information** means private facts about your case.
  * **Revoke** means cancel your permission.

  The signature and date are blank. The DTA client will fill them in by hand.
continue button field: dta_preview
---
id: dta review
event: dta_review
question: |
  Review your answers
review:
  - Edit: permission_purpose
    button: |
      **Permission:**
      % if permission_purpose == "information":
      Talk with DTA and share information about benefit cases.
      % elif permission_purpose == "representative":
      Sign forms for me or use my benefits.
      % else:
      I am not sure.
      % endif
  - Edit: client_name
    button: |
      **DTA client:** ${ client_name }
      **Date of birth:** ${ format_date(client_birthdate) }
  - Edit: dta_identifier_kind
    button: |
      **Case number:**
      % if dta_identifier_kind == "ssn":
      Last four numbers of Social Security number: ${ ssn_last_four }
      % else:
      DTA Agency ID: ${ dta_agency_id }
      % endif
  - Edit: recipient_name
    button: |
      **Person or group:** ${ recipient_name }
      **Address:** ${ recipient_address }
      **Phone:** ${ recipient_phone or 'None given' }
---
id: dta download
event: dta_download
question: |
  Print, sign, and send your DTA form
subquestion: |
  **This form has not been sent to DTA.**

  1. Download and print it. The DTA client must sign and date Section 5.
  2. Send the signed form to DTA. Choose one of the ways below.
  3. Keep a copy. You can also give a copy to the person or group you named.

  **Ways to send it:**

  * Upload a clear photo or scan through [DTA Connect](https://www.mass.gov/dtaconnect).
  * Fax it to **617-887-8765**.
  * Mail it to **DTA Document Processing Center, P.O. Box 4406, Taunton, MA 02780-0420**.

  To cancel this permission, call **1-877-382-2363** during business hours
  and speak with a DTA worker. Or write a note asking DTA to cancel it. Send the note by mail or fax.

  ${ action_button_html(url_action('dta_review'), label='Edit answers', color='primary') }
attachment code: dta_consent
---
attachment:
  name: DTA Voluntary Consent to Release Information
  filename: dta_information_release
  variable name: dta_consent
