metadata:
  review_date: 2026-11-22
  title: Give someone permission to talk with Massachusetts DTA
  short title: DTA information release
  description: >-
    Let someone talk with Massachusetts DTA about your benefits.
    Make the Voluntary Consent to Release Information form (VARI-OI).
    It lets DTA share facts about your SNAP (food stamps), TAFDC, or EAEDC cash benefits.
    Choose a person or group you trust. Check your answers, then print, sign, and send the form.
    This does not let someone sign forms or use your benefits.
  can_I_use_this_form: |
    Use this form if you get or have applied for Massachusetts DTA benefits.
    It lets DTA share facts about your case with a person or group you trust.
    The person whose case it is must sign the form. A helper can fill in the answers.
    Permission lasts for one year unless you cancel it sooner.
  before_you_start: |
    Have the DTA client's name and date of birth. Have their DTA Agency ID
    or the last four numbers of their Social Security number.
    Have the name and address of the person or group you want DTA to talk with.
    Bring their phone number too, if you know it.
    You will need to print the form so the DTA client can sign it.
  when_you_are_finished: |
    Print the form. The DTA client must sign and date it. Send it to DTA through
    DTA Connect, by fax, or by mail. Keep a copy.
