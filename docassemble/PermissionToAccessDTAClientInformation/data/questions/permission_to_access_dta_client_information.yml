metadata:
  title: Give someone permission to talk with Massachusetts DTA
  short title: DTA information release
  description: >-
    Make a Massachusetts DTA Voluntary Consent to Release Information form (VARI-OI).
    Give a trusted person or organization permission to discuss your SNAP, TAFDC,
    or EAEDC benefit cases with DTA. Review your answers, then print, sign, and
    send the form. This does not let someone sign applications or use your benefits.
  can_I_use_this_form: |
    Use this form if you receive or have applied for Massachusetts DTA benefits
    and want DTA to share case information with a person or organization you trust.
    The DTA client must sign the finished form. A helper can fill in the answers.
    Permission lasts for one year unless you cancel it sooner.
  before_you_start: |
    Have the DTA client's name, date of birth, and DTA Agency ID or last four
    digits of their Social Security number. Have the name, address, and phone
    number, if known, of the person or organization that will get the information.
    You will need to print the form so the DTA client can sign it.
  when_you_are_finished: |
    Print the form. The DTA client must sign and date it. Send it to DTA through
    DTA Connect, by fax, or by mail. Keep a copy.
  authors:
    - Trevor Mears
    - Suffolk LIT Lab
  jurisdiction: NAM-US-US+MA
  languages:
    - en
  maturity: testing
  estimated_completion_minutes: 5
  estimated_completion_delta: 3
  LIST_topics:
